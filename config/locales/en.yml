en:
  brand:
    name: "leftyou.one"
    description: "A small gift for moments that don’t need a big one."
  landing:
    meta_title: "leftyou.one — A small gift for someone"
    meta_description: "Discover one exact gift, see who comes to mind, and leave it for them to open."
    skip: "Skip to the story"
    home_label: "leftyou.one home"
    navigation:
      label: "Main navigation"
      how: "How it works"
      paths: "Gift paths"
      start: "Start a gift"
    hero:
      eyebrow: "A small gift for someone"
      heading: "Find the gift first. Then discover who it belongs with."
      context: "Choose a feeling and we’ll show you one exact, carefully made gift. If somebody comes to mind, leave it for them to open."
      start: "Start a gift"
      explore: "See how it works"
      reassure: "%{price} · about a minute · no account needed"
    example:
      stage_label: "An example of an authored gift"
      eyebrow: "An example gift"
      main: "A little courage before your doubts wake up."
      context: "For the thing you’ve been putting off."
      ritual: "Keep it until you begin."
      notice: "An example — not a gift waiting to be claimed."
    purpose:
      eyebrow: "What it’s for"
      heading: "Some moments are too small for a present — and too personal to let pass."
      lead: "A quiet thought about someone, in the middle of an ordinary day:"
      moments:
        - "A difficult morning."
        - "A tiny win no one else clapped for."
        - "A friend who could use ten quiet minutes."
      context: "leftyou.one gives that thought a little form — something another person can open, keep, and perhaps pass on much later."
    how:
      eyebrow: "How it works"
      heading: "It works backwards."
      context: "Usually you think of somebody and then look for a gift. Here, the gift comes first."
      action: "Start a gift"
      steps:
        discover:
          heading: "Discover"
          context: "Choose a broad feeling. One exact gift appears before we ask who it is for."
        notice:
          heading: "Notice"
          context: "Read it. If a real person comes to mind, that is the person it belongs with."
        leave:
          heading: "Leave"
          context: "Add their name and, if you want, a private note. Then share their private invitation."
        receive:
          heading: "Open and keep"
          context: "They open the same gift. It stays with them until they choose otherwise — possibly forever."
    paths:
      eyebrow: "Gift paths"
      heading: "The same gift can gather a history."
      context: "Some paths end after one handoff. Others continue when a future holder genuinely thinks of somebody else. Explore three examples below."
      timeline_label: "Example path for %{gift}"
      note: "These are illustrative paths, not gifts waiting to be claimed. Real invitations and journey details stay private to the people involved."
      examples:
        courage:
          label: "Path 01"
          image: "prototype/receiver/paper-world.webp"
          gift: "A little courage before your doubts wake up."
          context: "For the thing you’ve been putting off."
          trail: "Dimitar → Anna"
          state: "Still with Anna"
          story: "Dimitar left it for Anna. She opened it and kept it. A path does not have to go farther to mean something."
          stops:
            - role: "Started by"
              name: "Dimitar"
            - role: "Now with"
              name: "Anna"
        quiet:
          label: "Path 02"
          image: "prototype/receiver/quiet-light.webp"
          gift: "Ten quiet minutes with nothing to prove."
          context: "For the day that will not stop asking things of you."
          trail: "Maya → Leo → Noor"
          state: "Now with Noor"
          story: "Leo kept it for a while. Much later, Noor came to mind. The gift stayed the same; the new handoff became part of its path."
          stops:
            - role: "Started by"
              name: "Maya"
            - role: "Then with"
              name: "Leo"
            - role: "Now with"
              name: "Noor"
        evening:
          label: "Path 03"
          image: "prototype/receiver/after-rain.webp"
          gift: "A reason to take the long way home."
          context: "For the evening that can wait."
          trail: "Sam → Inez"
          state: "Kept by Inez"
          story: "Inez still has it. Keeping a gift is a complete ending, even when its path never becomes a long one."
          stops:
            - role: "Started by"
              name: "Sam"
            - role: "Now with"
              name: "Inez"
    invitation:
      eyebrow: "Receiving one"
      heading: "Somebody has to leave it for you."
      context: "You can explore these paths, but you can’t claim or join an existing gift from here. Receiving begins with a private invitation from the person leaving it for you."
      start_context: "Nothing waiting for you? Start one yourself. You won’t choose a person until after you have seen what you found."
      action: "Start a gift"
